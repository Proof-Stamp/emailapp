name: Build dual verifier WASM

on:
  push:
    branches:
      - feature/dual-local-verification
    paths:
      - rust-toolchain.toml
      - rust/sha256-wasm/**
      - scripts/embed-rust-wasm.mjs
      - .github/workflows/build-dual-verifier-wasm.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown

      - name: Generate locked dependencies
        run: cargo generate-lockfile --manifest-path rust/sha256-wasm/Cargo.toml

      - name: Build release verifier
        run: cargo +1.98.0 build --manifest-path rust/sha256-wasm/Cargo.toml --release --target wasm32-unknown-unknown --locked

      - name: Embed verifier without runtime fetch
        run: node scripts/embed-rust-wasm.mjs rust/sha256-wasm/target/wasm32-unknown-unknown/release/proofstamp_sha256_wasm.wasm public/rust-sha256-wasm.js

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/sha256-wasm/Cargo.lock public/rust-sha256-wasm.js
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git commit -m "build: generate Rust SHA-256 verifier artifact"
          git push origin HEAD:${{ github.ref_name }}
